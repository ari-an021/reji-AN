<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANレジ</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS (xlsx) ライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .product-img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            border-radius: 6px;
            background-color: #f8f9fa;
        }

        .product-img-placeholder {
            width: 100%;
            height: 120px;
            background-color: #e9ecef;
            color: #adb5bd;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .manage-product-item {
            cursor: grab;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .manage-product-item:active {
            cursor: grabbing;
        }

        .manage-product-item.dragging {
            opacity: 0.4;
            background-color: #eef2f7;
            border: 2px dashed #3498db;
        }

        .manage-product-item.drag-over {
            border-top: 3px solid #3498db;
        }

        .drag-handle {
            cursor: grab;
            color: #999;
            font-weight: bold;
            margin-right: 8px;
            user-select: none;
        }
    </style>
</head>

<body>

    <!-- ==================== パスワード認証モーダル ==================== -->
    <div id="authModal" class="modal-overlay" style="display: flex; z-index: 2000;">
        <div class="modal-content" style="max-width: 380px; text-align: center;">
            <h3>🔒 パスワード認証</h3>
            <p style="color: #666; font-size: 0.9rem; margin: 0 0 10px 0;">このレジアプリを利用するにはパスワードを入力してください。</p>
            <div class="form-group" style="text-align: left;">
                <label>パスワード:</label>
                <input type="password" id="authPasswordInput" placeholder="パスワードを入力"
                    style="font-size: 1.2rem; padding: 10px;">
            </div>
            <button id="authSubmitBtn" class="btn-confirm-payment" style="margin-top: 10px;">認証して進む</button>
            <div id="authErrorMsg" style="color: #c0392b; font-size: 0.85rem; margin-top: 8px; display: none;">
                パスワードが間違っています。</div>
        </div>
    </div>

    <header>
        <span id="headerTitle">ANレジ (同期中...)</span>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="openSalesModalBtn" class="btn-sales-header">📊 売上確認</button>
            <button id="modeToggleBtn" class="btn-mode-toggle">⚙️ 管理モードに切替</button>
        </div>
    </header>

    <!-- ==================== 通常レジ画面 ==================== -->
    <div id="posScreen" class="main-content" style="display: none;">
        <div class="product-selection">
            <div class="section-title">商品を選んでください（タップで追加）</div>
            <div class="category-tabs" id="categoryTabs"></div>
            <div class="product-grid" id="productGrid"></div>
        </div>

        <div class="cart-section">
            <div class="section-title">現在の会計</div>
            <div class="cart-item-list" id="cartItemList">
                <div style="color: #999; text-align: center; padding-top: 20px;">商品が選択されていません</div>
            </div>
            <div class="cart-summary">
                <div class="total-row">
                    <span>合計</span>
                    <span class="total-amount"><span id="totalAmount">0</span> 円</span>
                </div>
                <button class="btn-checkout" id="checkoutBtn" disabled>会計へ進む</button>
            </div>
        </div>
    </div>

    <!-- ==================== 管理モード画面 ==================== -->
    <div id="adminScreen" class="admin-container" style="display: none;">
        <div class="admin-header-title">
            <h2>ストア管理・編集 (クラウド同期)</h2>
            <p class="section-desc">商品の行を上下にドラッグ＆ドロップすると、レジ画面での表示順が変わります。</p>
        </div>

        <div class="admin-split-wrapper">
            <!-- ▼ 左側：カテゴリー管理 & パスワード変更エリア ▼ -->
            <div class="admin-pane">
                <div class="admin-section-box">
                    <h3>カテゴリー管理</h3>
                    <div class="form-group">
                        <label>新しいカテゴリー名:</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="newCategoryName" placeholder="例: アクセサリー" style="flex: 1;">
                            <button id="addCategoryBtn" class="btn-add-inline">追加</button>
                        </div>
                    </div>
                    <div class="category-manage-list" id="manageCategoryList"></div>
                </div>

                <!-- パスワード変更セクション -->
                <div class="admin-section-box" style="margin-top: 20px;">
                    <h3>🔐 パスワード変更</h3>
                    <div class="form-group">
                        <label>現在のパスワード:</label>
                        <input type="password" id="currentPasswordInput" placeholder="現在のパスワード">
                    </div>
                    <div class="form-group">
                        <label>新しいパスワード:</label>
                        <input type="password" id="newPasswordInput" placeholder="新しいパスワード">
                    </div>
                    <button id="changePasswordBtn" class="btn-edit"
                        style="width: 100%; padding: 10px; margin-top: 5px;">パスワードを更新する</button>
                </div>
            </div>

            <!-- ▼ 右側：商品管理エリア ▼ -->
            <div class="admin-pane">
                <!-- 新規商品追加フォーム -->
                <div class="admin-section-box">
                    <h3>新しい商品を追加</h3>
                    <div class="form-group">
                        <label>商品名:</label>
                        <input type="text" id="newProductName" placeholder="例: クリアファイル">
                    </div>
                    <div class="form-group" style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label>価格 (円):</label>
                            <input type="number" id="newProductPrice" placeholder="例: 500">
                        </div>
                        <div style="flex: 1;">
                            <label>初期在庫数:</label>
                            <input type="number" id="newProductStock" placeholder="例: 50" value="50">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>カテゴリー:</label>
                        <select id="newProductCategory"></select>
                    </div>
                    <div class="form-group">
                        <label>商品画像:</label>
                        <input type="file" id="newProductImage" accept="image/*">
                    </div>
                    <button id="addProductBtn" class="btn-add">商品を登録する</button>
                </div>

                <!-- 登録済み商品一覧（ドラッグ＆ドロップ対応） -->
                <div class="admin-section-box">
                    <h3>登録済み商品一覧（※上下にドラッグして並び替え可能）</h3>
                    <div id="manageProductList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 会計モーダル画面 ==================== -->
    <div id="checkoutModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>お会計</h3>
            <div class="checkout-info-row">
                <span>ご請求金額</span>
                <span class="checkout-total-price">¥<span id="modalTotalPrice">0</span></span>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label>お預かり金額:</label>
                <input type="number" id="receivedAmountInput" placeholder="例: 1000"
                    style="font-size: 1.5rem; padding: 12px; text-align: right;" readonly>
            </div>

            <div class="quick-cash-buttons">
                <button type="button" class="cash-btn" onclick="addReceived(100)">+100</button>
                <button type="button" class="cash-btn" onclick="addReceived(500)">+500</button>
                <button type="button" class="cash-btn" onclick="addReceived(1000)">+1,000</button>
                <button type="button" class="cash-btn" onclick="addReceived(5000)">+5,000</button>
                <button type="button" class="cash-btn" onclick="addReceived(10000)">+10,000</button>
            </div>

            <div class="calculator-pad">
                <button type="button" class="calc-btn" onclick="appendKey(7)">7</button>
                <button type="button" class="calc-btn" onclick="appendKey(8)">8</button>
                <button type="button" class="calc-btn" onclick="appendKey(9)">9</button>
                <button type="button" class="calc-btn exact-btn" onclick="setExactAmount()">丁度</button>

                <button type="button" class="calc-btn" onclick="appendKey(4)">4</button>
                <button type="button" class="calc-btn" onclick="appendKey(5)">5</button>
                <button type="button" class="calc-btn" onclick="appendKey(6)">6</button>
                <button type="button" class="calc-btn clear-btn" onclick="clearReceived()">クリア</button>

                <button type="button" class="calc-btn" onclick="appendKey(1)">1</button>
                <button type="button" class="calc-btn" onclick="appendKey(2)">2</button>
                <button type="button" class="calc-btn" onclick="appendKey(3)">3</button>
                <button type="button" class="calc-btn backspace-btn" onclick="backspaceKey()">⌫</button>

                <button type="button" class="calc-btn" onclick="appendKey(0)" style="grid-column: span 2;">0</button>
                <button type="button" class="calc-btn" onclick="appendKey('00')">00</button>
            </div>

            <div class="checkout-info-row change-row">
                <span>お釣り</span>
                <span class="checkout-change-price">¥<span id="modalChangePrice">0</span></span>
            </div>

            <div class="modal-actions">
                <button id="confirmPaymentBtn" class="btn-confirm-payment" disabled>会計を完了する</button>
                <button id="closeModalBtn" class="btn-close-modal">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- ==================== 売上確認モーダル画面 ==================== -->
    <div id="salesModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <h3>📊 本日の売上・在庫集計</h3>

            <div class="checkout-info-row" style="background: #e8f4fd;">
                <span>総売上金額</span>
                <span class="checkout-total-price" style="color: #2980b9;">¥<span id="salesTotalAmount">0</span></span>
            </div>

            <div class="section-title" style="margin-top: 10px;">商品別 販売数・在庫残数</div>
            <div class="sales-product-list" id="salesProductList"></div>

            <div class="modal-actions" style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px;">
                <button id="exportExcelBtn" class="btn-confirm-payment"
                    style="padding: 12px; font-size: 1rem; background-color: #27ae60;">📥 Excelファイルを出力</button>
                <button id="resetSalesBtn" class="btn-delete"
                    style="padding: 10px; font-size: 0.95rem;">売上・在庫データをリセット</button>
                <button id="closeSalesModalBtn" class="btn-close-modal">閉じる</button>
            </div>
        </div>
    </div>

    <!-- ==================== Firebase SDK (Webモジュール) ==================== -->
    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {getFirestore, collection, doc, getDoc, setDoc, deleteDoc, onSnapshot} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // Firebase 接続設定
        const firebaseConfig = {
            apiKey: "AIzaSyCEHegFqxOo2SQ0cInbrVuqyX7esWD9U8",
            authDomain: "anevent-pos-app.firebaseapp.com",
            projectId: "anevent-pos-app",
            storageBucket: "anevent-pos-app.firebasestorage.app",
            messagingSenderId: "53376432876",
            appId: "1:573376432876:web:fe153182bbb8c4b35673c9",
            measurementId: "G-G2RNKP119D"
        };

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- アプリケーション状態 ---
        let appPassword = "0107";
        let categories = [];
        let products = [];
        let salesHistory = [];
        let isCloudLoaded = false;

        let currentCategory = "すべて";
        let isAdminMode = false;

        // デフォルトの初期データ
        const defaultCategories = ["キーホルダー・ストラップ", "ステッカー", "文具", "その他"];
        const defaultProducts = [
            {id: 1, name: "アクリルキーホルダー", price: 800, category: "キーホルダー", image: "", stock: 30, order: 0},
            {id: 2, name: "ラバーキーホルダー", price: 900, category: "キーホルダー", image: "", stock: 25, order: 1},
            {id: 3, name: "ロゴステッカー", price: 300, category: "ステッカー", image: "", stock: 100, order: 2},
        ];

        // --- DOM要素 ---
        const authModal = document.getElementById("authModal");
        const authPasswordInput = document.getElementById("authPasswordInput");
        const authSubmitBtn = document.getElementById("authSubmitBtn");
        const authErrorMsg = document.getElementById("authErrorMsg");

        const posScreen = document.getElementById("posScreen");
        const adminScreen = document.getElementById("adminScreen");
        const modeToggleBtn = document.getElementById("modeToggleBtn");
        const headerTitle = document.getElementById("headerTitle");

        const categoryTabsEl = document.getElementById("categoryTabs");
        const productGrid = document.getElementById("productGrid");
        const cartItemList = document.getElementById("cartItemList");
        const totalAmountEl = document.getElementById("totalAmount");
        const checkoutBtn = document.getElementById("checkoutBtn");

        const checkoutModal = document.getElementById("checkoutModal");
        const modalTotalPrice = document.getElementById("modalTotalPrice");
        const receivedAmountInput = document.getElementById("receivedAmountInput");
        const modalChangePrice = document.getElementById("modalChangePrice");
        const confirmPaymentBtn = document.getElementById("confirmPaymentBtn");
        const closeModalBtn = document.getElementById("closeModalBtn");

        const openSalesModalBtn = document.getElementById("openSalesModalBtn");
        const salesModal = document.getElementById("salesModal");
        const closeSalesModalBtn = document.getElementById("closeSalesModalBtn");
        const salesTotalAmount = document.getElementById("salesTotalAmount");
        const salesProductList = document.getElementById("salesProductList");
        const resetSalesBtn = document.getElementById("resetSalesBtn");
        const exportExcelBtn = document.getElementById("exportExcelBtn");

        // --- Firestoreリアルタイム同期のセットアップ（独立コレクション方式） ---
        async function initCloudSync() {
            // 設定・履歴用ドキュメント
            const settingsRef = doc(db, "posStore", "settings");
            const settingsSnap = await getDoc(settingsRef);

            if (!settingsSnap.exists()) {
                await setDoc(settingsRef, {
                    password: "0107",
                    categories: defaultCategories,
                    salesHistory: []
                });
            }

            // 商品用コレクションの初期データ投入チェック
            const productsCol = collection(db, "posProducts");
            // 設定ドキュメントのリアルタイム監視
            onSnapshot(settingsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    appPassword = data.password || "0107";
                    categories = data.categories || [];
                    salesHistory = data.salesHistory || [];
                    checkReady();
                }
            });

            // 商品コレクションのリアルタイム監視
            onSnapshot(productsCol, async (snapshot) => {
                if (snapshot.empty) {
                    // 初回：デフォルト商品を個別ドキュメントとして登録
                    for (const p of defaultProducts) {
                        await setDoc(doc(db, "posProducts", String(p.id)), p);
                    }
                } else {
                    products = [];
                    snapshot.forEach(docSnap => {
                        const pData = docSnap.data();
                        products.push({
                            id: Number(docSnap.id),
                            name: pData.name,
                            price: pData.price,
                            category: pData.category,
                            image: pData.image || "",
                            stock: pData.stock !== undefined ? pData.stock : 0,
                            order: pData.order !== undefined ? pData.order : Number(docSnap.id),
                            qty: 0
                        });
                    });
                    // 並び順（order順）にソート
                    products.sort((a, b) => a.order - b.order);
                    checkReady();
                }
            });
        }

        function checkReady() {
            if (categories.length > 0) {
                isCloudLoaded = true;
                headerTitle.textContent = "ANレジ";
                render();
            }
        }

        // 基本設定（パスワード・カテゴリー・売上履歴）の保存
        async function saveSettings() {
            if (!isCloudLoaded) return;
            try {
                const settingsRef = doc(db, "posStore", "settings");
                await setDoc(settingsRef, {
                    password: appPassword,
                    categories: categories,
                    salesHistory: salesHistory
                });
            } catch (error) {
                console.error("設定保存エラー:", error);
                alert("設定の保存に失敗しました。");
            }
        }

        // 個別商品の保存・更新
        async function saveProductToCloud(product) {
            try {
                const prodRef = doc(db, "posProducts", String(product.id));
                await setDoc(prodRef, {
                    name: product.name,
                    price: product.price,
                    category: product.category,
                    image: product.image,
                    stock: product.stock,
                    order: product.order !== undefined ? product.order : product.id
                });
            } catch (error) {
                console.error("商品保存エラー:", error);
                alert("商品の保存に失敗しました。");
            }
        }

        // 個別商品の削除
        async function deleteProductFromCloud(id) {
            try {
                const prodRef = doc(db, "posProducts", String(id));
                await deleteDoc(prodRef);
            } catch (error) {
                console.error("商品削除エラー:", error);
                alert("商品の削除に失敗しました。");
            }
        }

        // --- 画像リサイズ（軽量化）関数 ---
        function resizeImage(file, maxWidth, maxHeight, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement("canvas");
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                    callback(dataUrl);
                };
            };
        }

        // --- パスワード認証 ---
        authSubmitBtn.addEventListener("click", () => {
            if (authPasswordInput.value === appPassword) {
                authModal.style.display = "none";
                posScreen.style.display = "flex";
                render();
            } else {
                authErrorMsg.style.display = "block";
                authPasswordInput.value = "";
            }
        });

        authPasswordInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                authSubmitBtn.click();
            }
        });

        document.getElementById("changePasswordBtn").addEventListener("click", async () => {
            const currentInput = document.getElementById("currentPasswordInput").value;
            const newInput = document.getElementById("newPasswordInput").value.trim();

            if (currentInput !== appPassword) {
                alert("現在のパスワードが間違っています。");
                return;
            }
            if (!newInput) {
                alert("新しいパスワードを入力してください。");
                return;
            }

            appPassword = newInput;
            await saveSettings();
            document.getElementById("currentPasswordInput").value = "";
            document.getElementById("newPasswordInput").value = "";
            alert("パスワードをクラウド上で更新しました！");
        });

        function render() {
            if (isAdminMode) {
                renderAdminScreen();
            } else {
                renderCategoryTabs();
                renderProductGrid();
                renderCart();
            }
        }

        function renderCategoryTabs() {
            categoryTabsEl.innerHTML = "";
            const displayCategories = ["すべて", ...categories];

            if (!displayCategories.includes(currentCategory)) {
                currentCategory = "すべて";
            }

            displayCategories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${currentCategory === cat ? "active" : ""}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    render();
                };
                categoryTabsEl.appendChild(btn);
            });
        }

        function getSoldCount(productId) {
            let sold = 0;
            salesHistory.forEach(record => {
                record.items.forEach(item => {
                    if (item.id === productId) {
                        sold += item.qty;
                    }
                });
            });
            return sold;
        }

        function renderProductGrid() {
            productGrid.innerHTML = "";
            let filteredProducts = products;
            if (currentCategory !== "すべて") {
                filteredProducts = products.filter(p => p.category === currentCategory);
            }

            if (filteredProducts.length === 0) {
                productGrid.innerHTML = '<div style="color: #999; grid-column: 1 / -1; text-align: center; padding: 20px;">このカテゴリーには商品がありません</div>';
                return;
            }

            filteredProducts.forEach(product => {
                const sold = getSoldCount(product.id);
                const remainingStock = (product.stock || 0) - sold;
                const isOutOfStock = remainingStock <= 0;

                const card = document.createElement("div");
                card.className = `product-card ${isOutOfStock ? "out-of-stock" : ""}`;
                if (!isOutOfStock) {
                    card.onclick = () => changeQty(product.id, 1);
                }

                let imageHtml = product.image ?
                    `<img src="${product.image}" class="product-img" alt="${product.name}">` :
                    `<div class="product-img-placeholder">画像</div>`;

                card.innerHTML = `
                <div>
                    ${imageHtml}
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">¥${product.price.toLocaleString()}</div>
                    <div class="product-stock-badge ${isOutOfStock ? "badge-red" : ""}">残り: ${remainingStock}</div>
                </div>
                <div class="qty-controls" onclick="event.stopPropagation()">
                    <button class="qty-btn qty-minus" onclick="changeQty(${product.id}, -1)">－</button>
                    <span class="qty-display">${product.qty}</span>
                    <button class="qty-btn qty-plus" ${isOutOfStock ? "disabled" : ""} onclick="changeQty(${product.id}, 1)">＋</button>
                </div>
            `;
                productGrid.appendChild(card);
            });
        }

        function renderCart() {
            cartItemList.innerHTML = "";
            let total = 0;
            const cartItems = products.filter(p => p.qty > 0);

            if (cartItems.length === 0) {
                cartItemList.innerHTML = '<div style="color: #999; text-align: center; padding-top: 20px;">商品が選択されていません</div>';
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.disabled = false;
                cartItems.forEach(item => {
                    const subtotal = item.price * item.qty;
                    total += subtotal;

                    const itemRow = document.createElement("div");
                    itemRow.className = "cart-item";
                    itemRow.innerHTML = `
                    <div>
                        <span class="cart-item-name">${item.name}</span>
                        <span class="cart-item-qty">×${item.qty}</span>
                    </div>
                    <div class="cart-item-subtotal">¥${subtotal.toLocaleString()}</div>
                `;
                    cartItemList.appendChild(itemRow);
                });
            }
            totalAmountEl.textContent = total.toLocaleString();
        }

        window.changeQty = function (id, delta) {
            const product = products.find(p => p.id === id);
            if (product) {
                const sold = getSoldCount(product.id);
                const remainingStock = (product.stock || 0) - sold;

                const newQty = product.qty + delta;
                if (newQty < 0) return;

                if (delta > 0 && newQty > remainingStock) {
                    alert("在庫数を超えることはできません。");
                    return;
                }

                product.qty = newQty;
                render();
            }
        };

        function renderAdminScreen() {
            const manageCategoryListEl = document.getElementById("manageCategoryList");
            manageCategoryListEl.innerHTML = "";

            categories.forEach((cat, index) => {
                const item = document.createElement("div");
                item.className = "manage-item";
                item.innerHTML = `
                <input type="text" value="${cat}" id="catInput_${index}" style="flex: 1; padding: 6px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 4px; margin-right: 8px;">
                <button class="btn-edit" onclick="window.renameCategory(${index})">変更</button>
            `;
                manageCategoryListEl.appendChild(item);
            });

            const selectEl = document.getElementById("newProductCategory");
            selectEl.innerHTML = "";
            categories.forEach(cat => {
                const option = document.createElement("option");
                option.value = cat;
                option.textContent = cat;
                selectEl.appendChild(option);
            });

            const manageProductListEl = document.getElementById("manageProductList");
            manageProductListEl.innerHTML = "";

            products.forEach((product, index) => {
                let categoryOptionsHtml = "";
                categories.forEach(cat => {
                    const selected = (cat === product.category) ? "selected" : "";
                    categoryOptionsHtml += `<option value="${cat}" ${selected}>${cat}</option>`;
                });

                const sold = getSoldCount(product.id);
                const remaining = (product.stock || 0) - sold;

                const item = document.createElement("div");
                item.className = "manage-product-item";
                item.draggable = true;
                item.dataset.index = index;

                item.innerHTML = `
                <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 6px;">
                    <span class="drag-handle">☰ ≡</span>
                    <span style="font-size: 0.85rem; color: #666; font-weight: bold;">[ 順序 #${index + 1} ]</span>
                </div>
                <div class="manage-product-form">
                    <input type="text" value="${product.name}" id="prodName_${product.id}" placeholder="商品名" style="flex: 2;">
                    <input type="number" value="${product.price}" id="prodPrice_${product.id}" placeholder="価格" style="flex: 1;">
                    <input type="number" value="${product.stock !== undefined ? product.stock : 0}" id="prodStock_${product.id}" placeholder="在庫" style="flex: 1;" title="初期在庫数">
                    <select id="prodCat_${product.id}" style="flex: 1.5;">
                        ${categoryOptionsHtml}
                    </select>
                </div>
                <div style="font-size: 0.85rem; color: #666; margin-top: 4px;">現在の理論残数: <strong>${remaining}個</strong> (販売済: ${sold}個)</div>
                <div class="manage-product-actions" style="margin-top: 6px;">
                    <button class="btn-edit" onclick="window.updateProduct(${product.id})">変更を保存</button>
                    <button class="btn-delete" onclick="window.deleteProduct(${product.id})">削除</button>
                </div>
            `;

                item.addEventListener("dragstart", (e) => {
                    e.dataTransfer.setData("text/plain", index);
                    setTimeout(() => item.classList.add("dragging"), 0);
                });

                item.addEventListener("dragend", () => {
                    item.classList.remove("dragging");
                    document.querySelectorAll(".manage-product-item").forEach(el => el.classList.remove("drag-over"));
                });

                item.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    item.classList.add("drag-over");
                });

                item.addEventListener("dragleave", () => {
                    item.classList.remove("drag-over");
                });

                item.addEventListener("drop", async (e) => {
                    e.preventDefault();
                    item.classList.remove("drag-over");
                    const fromIndex = parseInt(e.dataTransfer.getData("text/plain"));
                    const toIndex = index;

                    if (fromIndex !== toIndex) {
                        const movedItem = products.splice(fromIndex, 1)[0];
                        products.splice(toIndex, 0, movedItem);

                        // 全ての商品の順序（order）を更新して保存
                        for (let i = 0; i < products.length; i++) {
                            products[i].order = i;
                            await saveProductToCloud(products[i]);
                        }
                        render();
                    }
                });

                manageProductListEl.appendChild(item);
            });
        }

        document.getElementById("addCategoryBtn").addEventListener("click", async () => {
            const input = document.getElementById("newCategoryName");
            const catName = input.value.trim();

            if (!catName) {
                alert("カテゴリー名を入力してください。");
                return;
            }
            if (categories.includes(catName)) {
                alert("そのカテゴリーはすでに存在します。");
                return;
            }

            categories.push(catName);
            await saveSettings();
            input.value = "";
            render();
            alert(`カテゴリー「${catName}」を追加しました！`);
        });

        window.renameCategory = async function (index) {
            const inputEl = document.getElementById(`catInput_${index}`);
            const oldName = categories[index];
            const newName = inputEl.value.trim();

            if (!newName) {
                alert("カテゴリー名を入力してください。");
                inputEl.value = oldName;
                return;
            }

            if (oldName === newName) return;

            if (categories.includes(newName)) {
                alert("そのカテゴリー名はすでに存在します。");
                inputEl.value = oldName;
                return;
            }

            categories[index] = newName;
            products.forEach(async p => {
                if (p.category === oldName) {
                    p.category = newName;
                    await saveProductToCloud(p);
                }
            });

            await saveSettings();
            render();
            alert(`カテゴリー名を「${oldName}」から「${newName}」に変更しました！`);
        };

        window.updateProduct = async function (id) {
            const nameInput = document.getElementById(`prodName_${id}`);
            const priceInput = document.getElementById(`prodPrice_${id}`);
            const stockInput = document.getElementById(`prodStock_${id}`);
            const catSelect = document.getElementById(`prodCat_${id}`);

            const newName = nameInput.value.trim();
            const newPrice = parseInt(priceInput.value);
            const newStock = parseInt(stockInput.value);
            const newCat = catSelect.value;

            if (!newName || isNaN(newPrice) || newPrice < 0 || isNaN(newStock) || newStock < 0) {
                alert("正しい商品名、価格、在庫数を入力してください。");
                return;
            }

            const product = products.find(p => p.id === id);
            if (product) {
                product.name = newName;
                product.price = newPrice;
                product.stock = newStock;
                product.category = newCat;

                await saveProductToCloud(product);
                render();
                alert(`商品「${newName}」の情報を更新しました！`);
            }
        };

        window.deleteProduct = async function (id) {
            if (confirm("この商品を削除してもよろしいですか？")) {
                products = products.filter(p => p.id !== id);
                await deleteProductFromCloud(id);
                render();
            }
        };

        document.getElementById("addProductBtn").addEventListener("click", () => {
            const nameInput = document.getElementById("newProductName");
            const priceInput = document.getElementById("newProductPrice");
            const stockInput = document.getElementById("newProductStock");
            const categoryInput = document.getElementById("newProductCategory");
            const imageInput = document.getElementById("newProductImage");

            const name = nameInput.value.trim();
            const price = parseInt(priceInput.value);
            const stock = parseInt(stockInput.value);
            const category = categoryInput.value;

            if (!name || isNaN(price) || price <= 0 || isNaN(stock) || stock < 0) {
                alert("正しい商品名、価格、初期在庫数を入力してください。");
                return;
            }

            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            const newOrder = products.length;

            if (imageInput.files && imageInput.files[0]) {
                resizeImage(imageInput.files[0], 300, 300, async function (compressedDataUrl) {
                    await addProductData(newId, name, price, stock, category, compressedDataUrl, newOrder);
                });
            } else {
                addProductData(newId, name, price, stock, category, "", newOrder);
            }
        });

        async function addProductData(id, name, price, stock, category, image, order) {
            const newProduct = {id: id, name: name, price: price, category: category, image: image, stock: stock, order: order, qty: 0};
            products.push(newProduct);
            await saveProductToCloud(newProduct);

            document.getElementById("newProductName").value = "";
            document.getElementById("newProductPrice").value = "";
            document.getElementById("newProductStock").value = "50";
            document.getElementById("newProductImage").value = "";
            render();
            alert("新しい商品を追加しました！");
        }

        modeToggleBtn.addEventListener("click", () => {
            isAdminMode = !isAdminMode;

            if (isAdminMode) {
                posScreen.style.display = "none";
                adminScreen.style.display = "block";
                headerTitle.textContent = "ANレジ 【管理モード】";
                modeToggleBtn.textContent = "レジ画面に戻る";
                modeToggleBtn.style.backgroundColor = "#e74c3c";
                render();
            } else {
                adminScreen.style.display = "none";
                posScreen.style.display = "flex";
                headerTitle.textContent = "ANレジ";
                modeToggleBtn.textContent = "⚙️ 管理モードに切替";
                modeToggleBtn.style.backgroundColor = "rgba(255,255,255,0.2)";
                render();
            }
        });

        function getCurrentTotal() {
            return products.reduce((sum, p) => sum + (p.price * p.qty), 0);
        }

        checkoutBtn.addEventListener("click", () => {
            const total = getCurrentTotal();
            if (total <= 0) return;

            modalTotalPrice.textContent = total.toLocaleString();
            receivedAmountInput.value = "";
            modalChangePrice.textContent = "0";
            confirmPaymentBtn.disabled = true;

            checkoutModal.style.display = "flex";
        });

        closeModalBtn.addEventListener("click", () => {
            checkoutModal.style.display = "none";
        });

        function calculateChange() {
            const total = getCurrentTotal();
            const received = parseInt(receivedAmountInput.value) || 0;
            const change = received - total;

            if (received >= total) {
                modalChangePrice.textContent = change.toLocaleString();
                modalChangePrice.style.color = "#27ae60";
                confirmPaymentBtn.disabled = false;
            } else {
                modalChangePrice.textContent = "金額が不足しています";
                modalChangePrice.style.color = "#c0392b";
                confirmPaymentBtn.disabled = true;
            }
        }

        window.addReceived = function (amount) {
            const current = parseInt(receivedAmountInput.value) || 0;
            receivedAmountInput.value = current + amount;
            calculateChange();
        };

        window.appendKey = function (num) {
            let currentStr = receivedAmountInput.value;
            if (currentStr === "0" && num !== "00") {
                currentStr = "";
            }
            if (currentStr === "" && num === "00") return;

            currentStr += num.toString();
            receivedAmountInput.value = currentStr;
            calculateChange();
        };

        window.backspaceKey = function () {
            let currentStr = receivedAmountInput.value;
            if (currentStr.length > 0) {
                currentStr = currentStr.slice(0, -1);
                receivedAmountInput.value = currentStr;
            }
            calculateChange();
        };

        window.setExactAmount = function () {
            receivedAmountInput.value = getCurrentTotal();
            calculateChange();
        };

        window.clearReceived = function () {
            receivedAmountInput.value = "";
            calculateChange();
        };

        confirmPaymentBtn.addEventListener("click", async () => {
            const total = getCurrentTotal();
            const received = parseInt(receivedAmountInput.value) || 0;
            const change = received - total;

            const purchasedItems = products
                .filter(p => p.qty > 0)
                .map(p => ({
                    id: p.id,
                    name: p.name,
                    price: p.price,
                    qty: p.qty,
                    subtotal: p.price * p.qty
                }));

            const saleRecord = {
                timestamp: new Date().toISOString(),
                total: total,
                received: received,
                change: change,
                items: purchasedItems
            };

            salesHistory.push(saleRecord);
            products.forEach(p => p.qty = 0);

            await saveSettings();

            alert(`お会計が完了しました。\n\n合計: ¥${total.toLocaleString()}\nお預かり: ¥${received.toLocaleString()}\nお釣り: ¥${change.toLocaleString()}`);

            checkoutModal.style.display = "none";
            render();
        });

        openSalesModalBtn.addEventListener("click", () => {
            updateSalesModalContent();
            salesModal.style.display = "flex";
        });

        closeSalesModalBtn.addEventListener("click", () => {
            salesModal.style.display = "none";
        });

        function updateSalesModalContent() {
            let totalSales = salesHistory.reduce((sum, record) => sum + record.total, 0);
            salesTotalAmount.textContent = totalSales.toLocaleString();

            let productStatsMap = {};
            products.forEach(p => {
                productStatsMap[p.id] = {
                    name: p.name,
                    price: p.price,
                    stock: p.stock || 0,
                    totalQty: 0,
                    subtotal: 0
                };
            });

            salesHistory.forEach(record => {
                record.items.forEach(item => {
                    if (productStatsMap[item.id]) {
                        productStatsMap[item.id].totalQty += item.qty;
                        productStatsMap[item.id].subtotal += item.subtotal;
                    } else {
                        productStatsMap[item.id] = {
                            name: item.name,
                            price: item.price,
                            stock: 0,
                            totalQty: item.qty,
                            subtotal: item.subtotal
                        };
                    }
                });
            });

            salesProductList.innerHTML = "";
            const keys = Object.keys(productStatsMap);

            if (salesHistory.length === 0 && products.every(p => (p.stock || 0) === 0)) {
                salesProductList.innerHTML = '<div style="color: #999; text-align: center; padding: 15px;">データがありません</div>';
                return;
            }

            keys.forEach(id => {
                const data = productStatsMap[id];
                const remaining = data.stock - data.totalQty;

                const row = document.createElement("div");
                row.className = "sales-item-row";
                row.innerHTML = `
                <div>
                    <span style="font-weight: bold;">${data.name}</span>
                    <span style="color: #666; font-size: 0.85rem; margin-left: 6px;">(初期:${data.stock})</span>
                </div>
                <div style="display: flex; gap: 12px; align-items: center; font-size: 0.9rem;">
                    <span>売上: ${data.totalQty}個</span>
                    <span style="color: ${remaining <= 0 ? '#c0392b' : '#27ae60'}; font-weight: bold;">残:${remaining}個</span>
                    <span style="font-weight: bold; min-width: 60px; text-align: right;">¥${data.subtotal.toLocaleString()}</span>
                </div>
            `;
                salesProductList.appendChild(row);
            });
        }

        exportExcelBtn.addEventListener("click", () => {
            if (salesHistory.length === 0 && products.length === 0) {
                alert("出力するデータがありません。");
                return;
            }

            let productSummaryData = [
                ["商品名", "価格", "初期在庫数", "販売数", "残数", "売上小計"]
            ];

            let productStatsMap = {};
            products.forEach(p => {
                productStatsMap[p.id] = {
                    name: p.name,
                    price: p.price,
                    stock: p.stock || 0,
                    totalQty: 0,
                    subtotal: 0
                };
            });

            salesHistory.forEach(record => {
                record.items.forEach(item => {
                    if (productStatsMap[item.id]) {
                        productStatsMap[item.id].totalQty += item.qty;
                        productStatsMap[item.id].subtotal += item.subtotal;
                    } else {
                        productStatsMap[item.id] = {
                            name: item.name,
                            price: item.price,
                            stock: 0,
                            totalQty: item.qty,
                            subtotal: item.subtotal
                        };
                    }
                });
            });

            Object.values(productStatsMap).forEach(data => {
                productSummaryData.push([
                    data.name,
                    data.price,
                    data.stock,
                    data.totalQty,
                    data.stock - data.totalQty,
                    data.subtotal
                ]);
            });

            let transactionData = [
                ["日時", "商品名", "単価", "数量", "小計", "取引合計", "お預かり", "お釣り"]
            ];

            salesHistory.forEach(record => {
                const dateStr = new Date(record.timestamp).toLocaleString("ja-JP");
                record.items.forEach((item, index) => {
                    transactionData.push([
                        index === 0 ? dateStr : "",
                        item.name,
                        item.price,
                        item.qty,
                        item.subtotal,
                        index === 0 ? record.total : "",
                        index === 0 ? record.received : "",
                        index === 0 ? record.change : ""
                    ]);
                });
            });

            const wb = XLSX.utils.book_new();
            const wsProduct = XLSX.utils.aoa_to_sheet(productSummaryData);
            XLSX.utils.book_append_sheet(wb, wsProduct, "商品別集計");

            if (salesHistory.length > 0) {
                const wsTransaction = XLSX.utils.aoa_to_sheet(transactionData);
                XLSX.utils.book_append_sheet(wb, wsTransaction, "販売履歴");
            }

            const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
            XLSX.writeFile(wb, `売上レポート_${todayStr}.xlsx`);
        });

        resetSalesBtn.addEventListener("click", async () => {
            if (confirm("売上履歴データをリセットしてもよろしいですか？（在庫数は初期状態に戻ります）")) {
                salesHistory = [];
                await saveSettings();
                updateSalesModalContent();
                render();
                alert("データをリセットしました。");
            }
        });

        // 起動時にクラウド同期を開始
        initCloudSync();
    </script>

</body>

</html>
